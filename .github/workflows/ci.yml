name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.26.2']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}
        cache: true

    - name: Verify dependencies
      run: go mod verify

    - name: Download dependencies
      run: go mod download

    - name: Check formatting
      run: test -z "$(gofmt -l .)"

    - name: Run tests
      run: go test -v -race -coverprofile=coverage.out ./...

    - name: Generate coverage report
      if: matrix.go-version == '1.26.2'
      run: go tool cover -html=coverage.out -o coverage.html

    - name: Upload coverage to Codecov
      if: matrix.go-version == '1.26.2'
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.out
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}

    - name: Upload coverage report
      if: matrix.go-version == '1.26.2'
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage.html

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26.2'
        cache: true

    - name: Build Linux AMD64
      run: GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o beacon-vpn-linux_amd64 ./cmd/beacon-vpn

    - name: Build Linux ARM64
      run: GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o beacon-vpn-linux_arm64 ./cmd/beacon-vpn

    - name: Build macOS AMD64
      run: GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o beacon-vpn-darwin_amd64 ./cmd/beacon-vpn

    - name: Build macOS ARM64
      run: GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o beacon-vpn-darwin_arm64 ./cmd/beacon-vpn

    - name: Build Windows AMD64
      run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o beacon-vpn-windows_amd64.exe ./cmd/beacon-vpn

    - name: Build Windows ARM64
      run: GOOS=windows GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o beacon-vpn-windows_arm64.exe ./cmd/beacon-vpn

    - name: Generate checksums
      run: |
        sha256sum beacon-vpn-linux_amd64 beacon-vpn-linux_arm64 beacon-vpn-darwin_amd64 beacon-vpn-darwin_arm64 beacon-vpn-windows_amd64.exe beacon-vpn-windows_arm64.exe > checksums.txt
        cat checksums.txt

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: beacon-vpn-binaries
        path: |
          beacon-vpn-linux_amd64
          beacon-vpn-linux_arm64
          beacon-vpn-darwin_amd64
          beacon-vpn-darwin_arm64
          beacon-vpn-windows_amd64.exe
          beacon-vpn-windows_arm64.exe
          checksums.txt

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26.2'
        cache: true

    - name: golangci-lint
      uses: golangci/golangci-lint-action@v7
      with:
        version: v2.11.3

    - name: Run govulncheck
      run: |
        go install golang.org/x/vuln/cmd/govulncheck@latest
        govulncheck ./...
